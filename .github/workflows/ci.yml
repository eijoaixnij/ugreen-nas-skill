name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验 skill 项目
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验项目结构与 manifest
        run: python .github/scripts/validate_skill.py

      - name: 校验 YAML 语法
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, yaml
          from pathlib import Path

          failed = False
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"OK  {path}")
              except yaml.YAMLError as exc:
                  failed = True
                  print(f"FAIL {path}: {exc}")
          sys.exit(1 if failed else 0)
          PY

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m compileall -q skills/ugreen-nas/scripts .github/scripts

      - name: 冒烟测试 CLI
        run: |
          python skills/ugreen-nas/scripts/ugreen_nas_client.py --help
          python skills/ugreen-nas/scripts/ugreen_nas_client.py --url http://127.0.0.1:9999 --user t --password t 2>&1 | head -5 || true
